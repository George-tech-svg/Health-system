<!-- SOS Button Component -->
<style>
    .sos-container {
        margin: 10px 0 15px 0;
        text-align: center;
    }
    .sos-btn {
        background: #c62828;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        transition: all 0.3s ease;
        box-shadow: 0 2px 10px rgba(198, 40, 40, 0.3);
        animation: sosPulse 2s infinite;
    }
    .sos-btn:hover {
        background: #b71c1c;
        transform: scale(1.02);
    }
    @keyframes sosPulse {
        0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(198, 40, 40, 0); }
        100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); }
    }
    
    /* Emergency Confirmation Modal */
    .emergency-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 2000;
        align-items: center;
        justify-content: center;
    }
    .emergency-modal-content {
        background: white;
        border-radius: 20px;
        padding: 30px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        border-top: 5px solid #c62828;
    }
    .emergency-modal-content h3 {
        color: #c62828;
        margin-bottom: 15px;
        font-size: 24px;
    }
    .emergency-modal-content p {
        margin: 10px 0;
        font-size: 16px;
    }
    .emergency-warning {
        color: #c62828;
        font-size: 14px;
        margin-top: 15px;
        padding: 10px;
        background: #ffebee;
        border-radius: 10px;
    }
    .emergency-modal-buttons {
        display: flex;
        gap: 15px;
        margin-top: 25px;
        justify-content: center;
    }
    .confirm-sos {
        background: #c62828;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }
    .confirm-sos:hover {
        background: #b71c1c;
    }
    .cancel-sos {
        background: #9CA3AF;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
    }
    .cancel-sos:hover {
        background: #757575;
    }
</style>

<div class="sos-container">
    <button class="sos-btn" onclick="showEmergencyConfirm()">
        🚨 EMERGENCY SOS 🚨
    </button>
    <p style="font-size: 11px; color: #666; margin-top: 5px;">⚠️ Only click if you need immediate medical help</p>
</div>

<div id="emergencyModal" class="emergency-modal">
    <div class="emergency-modal-content">
        <h3>🚨 EMERGENCY ALERT 🚨</h3>
        <p><strong>Are you sure you need immediate medical help?</strong></p>
        <div class="emergency-warning">
            ⚠️ This will send an emergency alert to your doctor immediately!
        </div>
        <div class="emergency-modal-buttons">
            <button class="confirm-sos" onclick="sendEmergencySOS()">✓ YES, SEND ALERT</button>
            <button class="cancel-sos" onclick="closeEmergencyModal()">✗ CANCEL</button>
        </div>
    </div>
</div>

<script>
    function showEmergencyConfirm() {
        document.getElementById('emergencyModal').style.display = 'flex';
    }
    
    function closeEmergencyModal() {
        document.getElementById('emergencyModal').style.display = 'none';
    }
    
    async function sendEmergencySOS() {
        closeEmergencyModal();
        
        // Show sending indicator
        const sosBtn = document.querySelector('.sos-btn');
        const originalText = sosBtn.innerHTML;
        sosBtn.innerHTML = '📡 SENDING EMERGENCY ALERT...';
        sosBtn.disabled = true;
        sosBtn.style.opacity = '0.7';
        
        try {
            const response = await fetch('/patient/send_emergency', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                sosBtn.innerHTML = '✅ EMERGENCY ALERT SENT!';
                sosBtn.style.background = '#2E7D32';
                sosBtn.style.animation = 'none';
                
                // Show success message with hospital info
                let hospitalMsg = '';
                if (result.hospital) {
                    hospitalMsg = `\n\n🏥 Nearest Hospital: ${result.hospital.name}\n📞 Phone: ${result.hospital.phone}\n📍 Distance: ${result.hospital.distance_km} km`;
                }
                
                alert('🚨 EMERGENCY ALERT SENT! 🚨\n\nYour doctor has been notified.\nThey will contact you immediately.\n\nIf this is a life-threatening emergency, also call 911 or go to the nearest hospital.' + hospitalMsg);
                
                // Reload messages to show the emergency message
                setTimeout(() => {
                    location.reload();
                }, 2000);
            } else {
                sosBtn.innerHTML = originalText;
                sosBtn.disabled = false;
                sosBtn.style.opacity = '1';
                alert('❌ Error sending emergency alert. Please try again or call your doctor directly.');
            }
        } catch (error) {
            sosBtn.innerHTML = originalText;
            sosBtn.disabled = false;
            sosBtn.style.opacity = '1';
            alert('❌ Network error. Please check your connection and try again.');
        }
    }
</script>
